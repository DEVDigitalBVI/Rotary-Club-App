<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rotary Club of Road Town">
  <rect width="64" height="64" rx="14" fill="#0D315B"/>

  <!-- A simplified Rotary wheel, drawn boldly enough to survive at 16px. -->
  <g fill="#F7A81B">
    <rect x="29" y="3" width="6" height="10" rx="2"/>
    <rect x="29" y="51" width="6" height="10" rx="2"/>
    <rect x="29" y="3" width="6" height="10" rx="2" transform="rotate(45 32 32)"/>
    <rect x="29" y="51" width="6" height="10" rx="2" transform="rotate(45 32 32)"/>
    <rect x="29" y="3" width="6" height="10" rx="2" transform="rotate(90 32 32)"/>
    <rect x="29" y="51" width="6" height="10" rx="2" transform="rotate(90 32 32)"/>
    <rect x="29" y="3" width="6" height="10" rx="2" transform="rotate(135 32 32)"/>
    <rect x="29" y="51" width="6" height="10" rx="2" transform="rotate(135 32 32)"/>
    <circle cx="32" cy="32" r="24"/>
  </g>

  <circle cx="32" cy="32" r="18.5" fill="#17458F"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#FFCB56" stroke-width="1.5"/>

  <text
    x="32"
    y="37"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="800"
    letter-spacing="-1"
    text-anchor="middle"
  >RT</text>

  <!-- The sea-blue wave makes the mark specific to the club's island home. -->
  <path d="M21 42c3-2.5 5.5 2.5 8.5 0s5.5 2.5 8.5 0 5.5 2.5 8 0" fill="none" stroke="#00A2E0" stroke-linecap="round" stroke-width="2.5"/>
</svg>
